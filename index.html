<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
<head>
<meta charset="utf-8">
<!-- Oldschool handcraftetd HTML by email@davidhaberthuer.ch in a first instance. Details then ChatGPT-assisted. -->
<!-- https://stackoverflow.com/a/27832759/323100 for centering the iframe -->
<!-- http://umap.osm.ch/m/3161/ for the actual map -->
<!-- https://pages.github.com/ for hosting https://github.com/habi/wilkerstrasse.ch/ -->
<title>Adventskalender Wilkerstrasse</title>
<style>
  /* Red background for the page / frame */
  body {
    background: red;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: sans-serif;
  }

  /* Centered text above map */
  p {
    text-align: center;
    color: white;
    margin: 0.5em 0;
  }

  a:link,
  a:visited {
    color: green;
    background-color: transparent;
  }
  a:hover,
  a:active {
    color: red;
    background-color: transparent;
  }

  /* Iframe styling: keeps equal red borders on all sides with proportional shadow */
  iframe {
    display: block;
    border: 0;
    width: 80vw;   
    height: 80vh;  
    max-width: 1200px;
    max-height: 900px;
    border-radius: 2vw;  /* Rounded corners scale with viewport */
    box-shadow: 0 2vw 4vw rgba(0,0,0,0.4); /* Shadow scales with viewport */
  }

  /* Mobile: slightly bigger iframe to use more space and scale shadow */
  @media (max-width: 768px) {
    iframe {
      width: 90vw;
      height: 90vh;
      border-radius: 3vw;
      box-shadow: 0 3vw 6vw rgba(0,0,0,0.35);
    }
  }

  /* Two iframes: desktop / mobile zoom levels */
  .map-mobile { display: none; }
  @media (max-width: 768px) {
    .map-desktop { display: none; }
    .map-mobile { display: block; }
  }
</style>
</head>
<body>

<p>
  Weitere Adventsfenster bitte
  <a href="https://docs.google.com/spreadsheets/d/138xo1eQsQDVqV_yQnRw2q_nYmnanBTXMyER8kpjej_0/edit?usp=sharing">
    hier
  </a>
  eintragen.
</p>

<!-- Desktop iframe -->
<iframe
  class="map-desktop"
  frameborder="0"
  allowfullscreen
  allow="geolocation"
  src="//umap.osm.ch/en/map/adventsfenster-wilkerstrasse_3161?scaleControl=false&miniMap=false&scrollWheelZoom=false&zoomControl=true&editMode=disabled&moreControl=true&searchControl=null&tilelayersControl=null&embedControl=null&datalayersControl=true&onLoadPanel=none&captionBar=false&captionMenus=true&zoom=15">
</iframe>

<!-- Mobile iframe -->
<iframe
  class="map-mobile"
  frameborder="0"
  allowfullscreen
  allow="geolocation"
  src="//umap.osm.ch/en/map/adventsfenster-wilkerstrasse_3161?scaleControl=false&miniMap=false&scrollWheelZoom=false&zoomControl=true&editMode=disabled&moreControl=true&searchControl=null&tilelayersControl=null&embedControl=null&datalayersControl=true&onLoadPanel=none&captionBar=false&captionMenus=true&zoom=17">
</iframe>

</body>
</html>
